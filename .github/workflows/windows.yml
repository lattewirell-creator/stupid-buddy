# Builds and tests The Stupid Buddy for Windows on GitHub's Windows machines, runs its self-test, and makes the installer.
name: Windows
on:
  push:
    paths: ["windows/**", "ui/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: windows
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup update stable && rustup default stable
      - name: Test
        run: cargo test --release
      - name: Build
        run: cargo build --release
      - name: Self-test
        shell: pwsh
        run: |
          # The app tries its tools (files, web, keys, screenshots, Hands on/off, the window) and logs each result.
          $log = "$env:RUNNER_TEMP\buddy.log"
          $env:STUPID_BUDDY_SELFTEST = "1"; $env:STUPID_BUDDY_LOG = $log; $env:STUPID_BUDDY_DATA = "$env:RUNNER_TEMP\buddy-data"
          $p = Start-Process -FilePath target\release\stupid-buddy.exe -PassThru
          for ($i = 0; $i -lt 60 -and -not $p.HasExited; $i++) { Start-Sleep -Seconds 2 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id; Write-Host "The app didn't quit by itself" }
          if (-not (Test-Path $log)) { Write-Error "No self-test log"; exit 1 }
          $text = Get-Content $log -Raw
          Write-Host $text
          $want = @('DEVICE PC', 'OK files.roots', 'OK files.write', 'OK files.read', 'FAIL files.list', 'OK web.search [{', 'OK hands.start', 'OK hands.stop', 'OK window', 'DONE')
          $bad = $want | Where-Object { -not $text.Contains($_) }
          if ($bad) { Write-Error "Missing: $($bad -join ', ')"; exit 1 }
          if ($text -notmatch 'OK hands\.shot \{"height') { Write-Error "Hands Buddy couldn't take a screenshot"; exit 1 }
      - name: Showcase (screenshots) and a throw
        shell: pwsh
        run: |
          # The app shows its views one by one and logs "SHOT name"; this takes a picture of the screen each time.
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          $shots = "$env:RUNNER_TEMP\shots"; New-Item -ItemType Directory -Force $shots | Out-Null
          $log = "$env:RUNNER_TEMP\showcase.log"
          # GitHub's Windows machines have no graphics chip: software WebGL, so the screenshots show the 3D Buddy.
          $env:WEBVIEW2_ADDITIONAL_BROWSER_ARGUMENTS = "--use-angle=swiftshader --enable-unsafe-swiftshader --ignore-gpu-blocklist"
          $env:STUPID_BUDDY_SHOWCASE = "1"; $env:STUPID_BUDDY_SELFTEST = $null; $env:STUPID_BUDDY_LOG = $log; $env:STUPID_BUDDY_DATA = "$env:RUNNER_TEMP\buddy-show"
          $p = Start-Process -FilePath target\release\stupid-buddy.exe -PassThru
          $done = @{}
          for ($i = 0; $i -lt 300 -and -not $p.HasExited; $i++) {
            Start-Sleep -Milliseconds 300
            if (Test-Path $log) { foreach ($line in Get-Content $log) { if ($line -match 'SHOT (\S+)' -and -not $done[$Matches[1]]) {
              $name = $Matches[1]; $done[$name] = $true; Start-Sleep -Milliseconds 700
              $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
              $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
              [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
              $bmp.Save("$shots\$name.png"); Write-Host "Took $name ($($b.Width)x$($b.Height))" } } }
          }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }
          Get-Content $log
          # A throw: the ball should fly, bounce and land on the bottom of the screen.
          $env:STUPID_BUDDY_SHOWCASE = $null; $env:STUPID_BUDDY_THROW = "1600,-1400"; $tlog = "$env:RUNNER_TEMP\throw.log"; $env:STUPID_BUDDY_LOG = $tlog
          $p = Start-Process -FilePath target\release\stupid-buddy.exe -PassThru
          for ($i = 0; $i -lt 40 -and -not $p.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }
          if (Test-Path $tlog) { Get-Content $tlog } else { Write-Host "The throw didn't log a landing" }
          Write-Host "Work area: $([System.Windows.Forms.Screen]::PrimaryScreen.WorkingArea)"
      - name: Update check (dry run)
        shell: pwsh
        run: |
          # Pretends to be Buddy 0.0.1: finds the newest release, downloads its installer and checks the signature.
          $log = "$env:RUNNER_TEMP\update.log"
          $env:STUPID_BUDDY_SHOWCASE = $null; $env:STUPID_BUDDY_THROW = $null; $env:STUPID_BUDDY_UPDATE_DRYRUN = "0.0.1"; $env:STUPID_BUDDY_LOG = $log; $env:STUPID_BUDDY_DATA = "$env:RUNNER_TEMP\buddy-update"
          $p = Start-Process -FilePath target\release\stupid-buddy.exe -PassThru
          for ($i = 0; $i -lt 120 -and -not $p.HasExited; $i++) { Start-Sleep -Milliseconds 500 }
          if (-not $p.HasExited) { Stop-Process -Id $p.Id }
          $text = if (Test-Path $log) { Get-Content $log -Raw } else { "" }
          Write-Host $text
          if ($text -match 'failed its signature check') { Write-Error "A released installer doesn't match its signature"; exit 1 }
          # Releases before 0.8.0 have no signature yet; from then on this should say "verified".
      - uses: actions/upload-artifact@v4
        with:
          name: windows-screenshots
          path: ${{ runner.temp }}/shots/*.png
      - name: Installer
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          # The installer maker comes from Chocolatey, which is sometimes briefly down: try a few times.
          for ($i = 0; $i -lt 4 -and -not (Test-Path $nsis); $i++) { choco install nsis -y --no-progress; if (-not (Test-Path $nsis)) { Start-Sleep -Seconds 20 } }
          New-Item -ItemType Directory -Force dist | Out-Null
          & $nsis /V2 "/DVERSION=$version" installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem dist, target\release\stupid-buddy.exe | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: windows/dist/*.exe
