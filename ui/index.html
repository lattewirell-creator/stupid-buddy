<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src http://localhost:11434 http://127.0.0.1:11434; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'">
<title>The Stupid Buddy</title>
<link rel="stylesheet" href="style.css">
</head>
<!-- The Stupid Buddy: the ball on your desktop (closed) and the team panel (open). Logic: ai.js (the local AI),
     team.js (Buddy and the helpers), app.js (this window). -->
<body class="closed">
  <button id="ball" class="ball big" aria-label="Open Buddy"><i></i><i></i><span id="ballDot"></span></button>

  <main id="panel">
    <header class="head">
      <span id="headBall" class="ball"><i></i><i></i></span>
      <div class="who"><div class="name serif">Buddy</div><div id="status" class="status">Waking up…</div></div>
      <button id="newBtn" class="chip">New chat</button>
      <button id="setBtn" class="icon" aria-label="Settings"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3M12 18v3M3 12h3M18 12h3M5.6 5.6l2.1 2.1M16.3 16.3l2.1 2.1M5.6 18.4l2.1-2.1M16.3 7.7l2.1-2.1"/></svg></button>
      <button id="closeBtn" class="icon" aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </header>

    <section id="log"></section>

    <section id="settings" class="hidden">
      <h2 class="serif">Settings</h2>
      <div class="group">
        <div class="label">Make Buddy yours</div>
        <div id="lookBox"></div>
      </div>
      <div class="group">
        <div class="label">Where Buddy’s brain runs</div>
        <div id="providers"></div>
        <div id="keyBox" class="hidden">
          <div class="keyrow"><input id="keyInput" type="password" placeholder="Paste your free key" spellcheck="false" autocomplete="off"><button id="keySave" class="chip">Save</button></div>
          <button id="keyGet" class="link left">Get a free key →</button>
        </div>
        <div id="ollamaState" class="note"></div>
      </div>
      <div id="voiceBox" class="group hidden">
        <div class="label">Talking to Buddy</div>
        <label class="row check"><input id="speakAnswers" type="checkbox"><span class="grow">Read answers aloud when I talk</span></label>
        <div id="voiceNote" class="note"></div>
      </div>
      <div class="group">
        <div class="label">Which model each one uses</div>
        <div id="models"></div>
      </div>
      <div class="group">
        <div class="label">Folders your helpers may use</div>
        <div id="roots" class="note"></div>
        <button id="addRoot" class="chip">Allow another folder…</button>
      </div>
      <div class="group">
        <div class="label">The team</div>
        <div id="teamList"></div>
      </div>
      <button id="setDone" class="primary">Done</button>
      <button id="updateBtn" class="link hidden">Check for updates</button>
      <div id="updateNote" class="note hidden"></div>
      <button id="quitBtn" class="link">Quit The Stupid Buddy</button>
    </section>

    <div id="chips"></div>
    <form id="ask">
      <textarea id="input" rows="1" placeholder="What should we do?" autofocus></textarea>
      <button id="mic" class="send mic hidden" type="button" aria-label="Talk"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg></button>
      <button id="send" class="send" type="submit" aria-label="Send"><svg viewBox="0 0 24 24"><path d="M5 12h13M12.5 6l6 6-6 6"/></svg></button>
    </form>
  </main>

<script src="ai.js"></script>
<script src="team.js"></script>
<script src="look.js"></script>
<script src="ball3d.js"></script>
<script src="app.js"></script>
<script type="module" src="buddy3d.js"></script>
</body>
</html>
