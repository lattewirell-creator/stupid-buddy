[package]
name = "stupid-buddy"
version = "0.8.1"
edition = "2021"
description = "Buddy and a small team that does work for you"

[dependencies]
arboard = { version = "3.7.0", default-features = false }
base64 = "0.23.1"
dirs = "7"
dunce = "1.0.5"
ed25519-dalek = "3.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
include_dir = "0.7.4"
pdf-extract = "0.12.1"
regex = "1.13.1"
rfd = "0.17.2"
serde_json = "1.0.154"
tao = "0.37.1"
trash = "5.2.9"
ureq = "3.4.2"
walkdir = "2.5.0"
wry = "0.57.0"
zip = { version = "9.0.5", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
uiautomation = "0.25.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_Shell"] }

# Linux: GTK (the same one tao and wry use) for alerts and the screen's work area, and the Secret Service
# (GNOME Keyring) for AI keys.
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
keyring = { version = "3.6", default-features = false, features = ["sync-secret-service", "crypto-rust"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[build-dependencies]
winresource = "0.1.34"

# The Linux package (linux/build.sh runs cargo deb; Depends come from the libraries the program links to).
[package.metadata.deb]
name = "stupid-buddy"
maintainer = "Lattewirell <lattewirell@gmail.com>"
copyright = "lattewirell-creator"
license-file = ["../LICENSE", "0"]
extended-description = "Buddy from The Stupid Browser on your desktop, with a small team that does work for you: File Buddy, Writer Buddy and Web Buddy."
section = "utils"
revision = ""
priority = "optional"
depends = "$auto"
assets = [
    ["target/release/stupid-buddy", "usr/bin/", "755"],
    ["../linux/stupid-buddy.desktop", "usr/share/applications/", "644"],
    ["target/linux-icons/16x16/apps/stupid-buddy.png", "usr/share/icons/hicolor/16x16/apps/", "644"],
    ["target/linux-icons/24x24/apps/stupid-buddy.png", "usr/share/icons/hicolor/24x24/apps/", "644"],
    ["target/linux-icons/32x32/apps/stupid-buddy.png", "usr/share/icons/hicolor/32x32/apps/", "644"],
    ["target/linux-icons/48x48/apps/stupid-buddy.png", "usr/share/icons/hicolor/48x48/apps/", "644"],
    ["target/linux-icons/64x64/apps/stupid-buddy.png", "usr/share/icons/hicolor/64x64/apps/", "644"],
    ["target/linux-icons/128x128/apps/stupid-buddy.png", "usr/share/icons/hicolor/128x128/apps/", "644"],
    ["target/linux-icons/256x256/apps/stupid-buddy.png", "usr/share/icons/hicolor/256x256/apps/", "644"],
    ["target/linux-icons/512x512/apps/stupid-buddy.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]
